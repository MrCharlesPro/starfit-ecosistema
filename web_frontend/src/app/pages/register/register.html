<section class="auth-section">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card__header">
        <svg class="auth-card__star" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L15.09 10.26H24L17.55 15.74L20.64 24L12 18.52L3.36 24L6.45 15.74L0 10.26H8.91L12 2Z"/>
        </svg>
        <h1 class="auth-card__title">Únete a StarFit</h1>
        <p class="auth-card__subtitle">Comienza tu transformación hoy</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage" class="auth-form">
        <div class="form-group">
          <label for="fullName" class="form-label">Nombre completo</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              id="fullName" 
              type="text" 
              formControlName="fullName" 
              placeholder="Tu nombre completo"
              class="form-input"
            />
          </div>
          <span class="form-error" *ngIf="fullName?.invalid && fullName?.touched">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Mínimo 3 caracteres.
          </span>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-10 5L2 7"></path>
            </svg>
            <input 
              id="email" 
              type="email" 
              formControlName="email" 
              placeholder="tu@email.com"
              class="form-input"
            />
          </div>
          <span class="form-error" *ngIf="email?.invalid && email?.touched">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Correo válido requerido.
          </span>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Teléfono</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <input 
              id="phone" 
              type="tel" 
              formControlName="phone" 
              placeholder="10 dígitos"
              class="form-input"
            />
          </div>
          <span class="form-error" *ngIf="phone?.invalid && phone?.touched">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            10 dígitos requeridos.
          </span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              id="password" 
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password" 
              placeholder="••••••••"
              class="form-input"
            />
            <button 
              type="button"
              class="form-input-toggle"
              (click)="togglePasswordVisibility()"
              aria-label="Mostrar contraseña"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="form-error" *ngIf="password?.invalid && password?.touched">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Mínimo 6 caracteres.
          </span>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <input 
              id="confirmPassword" 
              [type]="showConfirmPassword ? 'text' : 'password'"
              formControlName="confirmPassword" 
              placeholder="••••••••"
              class="form-input"
            />
            <button 
              type="button"
              class="form-input-toggle"
              (click)="toggleConfirmPasswordVisibility()"
              aria-label="Mostrar contraseña"
            >
              <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="form-error" *ngIf="registerForm.errors?.['passwordsMismatch'] && confirmPassword?.touched">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Las contraseñas no coinciden.
          </span>
        </div>

        <div class="form-group form-group--checkbox">
          <input 
            id="terms" 
            type="checkbox" 
            formControlName="terms"
            class="form-checkbox"
          />
          <label for="terms" class="form-checkbox-label">
            Acepto los <a routerLink="/terms" class="form-link">términos y condiciones</a> y la <a routerLink="/privacy" class="form-link">política de privacidad</a>
          </label>
        </div>

        <span class="form-error" *ngIf="terms?.invalid && terms?.touched">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          Debes aceptar los términos.
        </span>

        <button 
          type="submit" 
          class="btn btn--primary btn--full" 
          [disabled]="isLoading || terms?.value !== true"
        >
          <span *ngIf="!isLoading">Crear mi cuenta</span>
          <span *ngIf="isLoading" class="btn-loading">
            <svg class="spinner" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20"></circle>
            </svg>
            Creando cuenta...
          </span>
        </button>
      </form>

      <div *ngIf="successMessage" class="auth-success">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <p>{{ successMessage }}</p>
      </div>

      <div class="auth-divider" *ngIf="!successMessage">
        <span>¿Ya tienes cuenta?</span>
      </div>

      <p class="auth-footer" *ngIf="!successMessage">
        <a routerLink="/login" class="auth-link">Inicia sesión aquí</a>
      </p>
    </div>
  </div>
</section>
