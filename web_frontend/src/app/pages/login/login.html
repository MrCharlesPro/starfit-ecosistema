<section class="auth-section">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card__header">
        <svg class="auth-card__star" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L15.09 10.26H24L17.55 15.74L20.64 24L12 18.52L3.36 24L6.45 15.74L0 10.26H8.91L12 2Z"/>
        </svg>
        <h1 class="auth-card__title">Bienvenido de vuelta</h1>
        <p class="auth-card__subtitle">Inicia sesión en tu cuenta StarFit</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-10 5L2 7"></path>
            </svg>
            <input 
              id="email" 
              type="email" 
              formControlName="email" 
              placeholder="tu@email.com"
              class="form-input"
            />
          </div>
          <span class="form-error" *ngIf="email?.invalid && email?.touched">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Ingresa un correo válido.
          </span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="form-input-wrapper">
            <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              id="password" 
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password" 
              placeholder="••••••••"
              class="form-input"
            />
            <button 
              type="button"
              class="form-input-toggle"
              (click)="togglePasswordVisibility()"
              aria-label="Mostrar contraseña"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="form-error" *ngIf="password?.invalid && password?.touched">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            Mínimo 6 caracteres.
          </span>
        </div>

        <div class="form-group form-group--checkbox">
          <input 
            id="rememberMe" 
            type="checkbox" 
            formControlName="rememberMe"
            class="form-checkbox"
          />
          <label for="rememberMe" class="form-checkbox-label">Recuérdame en este dispositivo</label>
        </div>

        <p class="auth-error" *ngIf="errorMessage">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          {{ errorMessage }}
        </p>

        <button 
          type="submit" 
          class="btn btn--primary btn--full" 
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">Iniciar sesión</span>
          <span *ngIf="isLoading" class="btn-loading">
            <svg class="spinner" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20"></circle>
            </svg>
            Ingresando...
          </span>
        </button>
      </form>

      <div class="auth-divider">
        <span>¿No tienes cuenta?</span>
      </div>

      <p class="auth-footer">
        <a routerLink="/register" class="auth-link">Crear una cuenta gratuita</a>
      </p>

      <p class="auth-help">
        <a href="#" class="auth-link-secondary">¿Olvidaste tu contraseña?</a>
      </p>
    </div>
  </div>
</section>
